name: Build MT IPTV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Unpack MT IPTV project
        run: |
          unzip -q MT_IPTV_v5_final_landscape.zip -d project
          test -f project/MT_IPTV_V5/settings.gradle

      - name: Build APK
        working-directory: project/MT_IPTV_V5
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MT-IPTV-APK
          path: project/MT_IPTV_V5/app/build/outputs/apk/debug/*.apk
          retention-days: 7
