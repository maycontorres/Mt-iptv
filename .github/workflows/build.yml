name: Build AUREON V35

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack AUREON V35
        run: |
          rm -rf project
          mkdir project
          unzip -q AUREON_V35_TV_PRO.zip -d project
          test -f project/AUREON_V35/settings.gradle

      - name: Build V35
        working-directory: project/AUREON_V35
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSecureDebug :app:assembleCompatDebug :app:assembleSecureRelease :app:assembleCompatRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-V35-APKs
          path: project/AUREON_V35/app/build/outputs/apk/**/*.apk
          retention-days: 7
