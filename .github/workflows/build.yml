name: Build AUREON V32 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack AUREON V32 project
        run: |
          rm -rf project
          mkdir project
          unzip -q AUREON_V32_otimizado_completo.zip -d project
          test -f project/AUREON_V32/settings.gradle

      - name: Build APK
        working-directory: project/AUREON_V32
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-V32-APK
          path: project/AUREON_V32/app/build/outputs/apk/debug/*.apk
          retention-days: 7
