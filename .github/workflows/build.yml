name: unzip -q AUREON_V35_11_BOTAO_FIXO.zip -d project

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      -       - name: Unpack AUREON V35.11
        run: |
          rm -rf project
          mkdir project
          unzip -q AUREON_V35_11_BOTAO_FIXO.zip -d project
          unzip -q AUREON_V35_TV_PRO.zip -d project
          test -f project/AUREON_V35/settings.gradle
          grep -q "versionName '35.11'" project/AUREON_V35/app/build.gradle
          grep -q "ENTRAR E CONECTAR" project/AUREON_V35/app/src/main/java/com/mtiptv/app/MainActivity.java
          grep -q "code.setSingleLine(true)" project/AUREON_V35/app/src/main/java/com/mtiptv/app/MainActivity.java
          echo "CONFIRMADO: compilando AUREON 35.11 corrigido"

      - name: Build verified V35.11
        working-directory: project/AUREON_V35
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSecureDebug :app:assembleCompatDebug --stacktrace

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: AUREON-V35-11-CORRIGIDO
          path: project/AUREON_V35/app/build/outputs/apk/**/*debug.apk
          retention-days: 7
          if-no-files-found: error
